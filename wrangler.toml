# Cloudflare Workers 靜態網站設定
#
# 部署三步驟：
#   1. 把下面的 name 改成你自己取的專案名稱（小寫英文與連字號）
#      部署後的網址會是  <name>.<你的帳號子網域>.workers.dev
#   2. node build.mjs        產生 dist/
#   3. npx wrangler deploy   上傳（第一次會開瀏覽器要你登入 Cloudflare）
#
# 也可以不用指令：到 Cloudflare 儀表板 Workers & Pages 手動上傳 dist.zip。

name = "my-measure-app"
compatibility_date = "2026-08-15"

[assets]
directory = "./dist"

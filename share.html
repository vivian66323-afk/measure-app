<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<meta name="robots" content="noindex,nofollow">
<!-- 這頁的網址是 /s/<token>，相對路徑會被解析成 /s/js/…，所以固定以站台根目錄為基準 -->
<base href="/">
<title>丈量成果 — 丈量APP</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232e7cf6'/><path d='M14 40h36M14 40v-8M50 40v-8M23 40v-5M32 40v-8M41 40v-5' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/></svg>">
<style>
  body{overflow:auto;display:block;user-select:text}
  .sh-wrap{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
  .sh-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .sh-head h1{margin:0;font-size:24px;letter-spacing:.5px}
  .sh-head .meta{color:var(--fg3);font-size:12px;line-height:1.8}
  .sh-badge{margin-left:auto;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--fg3);font-size:11px}
  .sh-sec{margin:30px 0}
  .sh-sec>h2{font-size:15px;margin:0 0 12px;padding-left:9px;border-left:3px solid var(--accent)}
  .sh-plan{background:#fff;border-radius:12px;padding:10px;overflow-x:auto}
  .sh-plan svg{width:100%;height:auto;display:block;min-width:520px}
  .sh-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:14px}
  .sh-stat{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#161c24}
  .sh-stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin-bottom:2px}
  .sh-stat span{color:var(--fg3);font-size:11px;letter-spacing:1px}
  .sh-photo{position:relative;border-radius:var(--r);overflow:hidden;background:#000;line-height:0}
  .sh-photo img{width:100%;display:block}
  .sh-photo .m{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:20px;background:rgba(232,133,58,.94);border:2px solid #fff;color:#fff;font:700 11px/1.3 ui-monospace,system-ui;white-space:nowrap}
  .sh-cap{color:var(--fg2);font-size:12px;padding:7px 2px}
  .sh-loading{text-align:center;padding:90px 20px;color:var(--fg3)}
  @media print{
    body{background:#fff;color:#000}
    .sh-badge,.sh-noprint{display:none}
    .sh-sec{break-inside:avoid}
    .sh-stat{background:#fff;border-color:#ccc}
  }
</style>
</head>
<body>
<div class="sh-wrap" id="root">
  <div class="sh-loading">載入中…</div>
</div>
<div class="toasts" id="toasts"></div>
<script type="module" src="js/share.js"></script>
</body>
</html>
